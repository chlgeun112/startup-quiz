<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나는 어떤 기업가일까? — 기업가의 자질과 특성</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="stage">
  <div class="film" id="film">
    <div class="layer portrait" id="portrait"></div>
    <div class="layer scrim" id="scrim"></div>
    <div class="layer scan"></div>
    <div class="layer grain"></div>
    <div class="layer vig"></div>
    <div class="tracking" id="tracking"></div>
    <span class="mark tl"></span><span class="mark tr"></span><span class="mark bl"></span><span class="mark br"></span>

    <div class="slate">
      <span id="slateL">Frame 01 / 07</span>
      <span class="mid">Archive · 기업가의 자질과 특성</span>
      <span class="rec" id="tc">00:00:00:00</span>
    </div>

    <div class="content" id="content"></div>

    <div class="hint">→ 다음 &nbsp;·&nbsp; ← 이전 &nbsp;·&nbsp; 1–4 선택 &nbsp;·&nbsp; F 전체화면 &nbsp;·&nbsp; R 다시하기</div>

    <div class="nav" id="nav">
      <button class="btn ghost" id="back">← Back</button>
      <div class="ticks" id="ticks"></div>
      <button class="btn solid" id="next">Next →</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
